<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Папка после армии</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d0d;
      color: #e8e8e8;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    header { text-align: center; margin-bottom: 32px; }
    header h1 { font-size: 2.4rem; font-weight: 700; color: #fff; }
    header p { margin-top: 8px; color: #666; font-size: 0.95rem; }

    /* Nav */
    .nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 40px;
    }
    .nav-btn {
      background: #141414;
      border: 1px solid #222;
      color: #666;
      border-radius: 10px;
      padding: 8px 22px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn.active {
      background: #1a1a2e;
      border-color: #2a2a4a;
      color: #4f8ef7;
    }

    /* Sync */
    .sync-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.78rem; color: #3a3; margin-top: 6px;
    }
    .sync-badge.saving { color: #a259f7; }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* Progress */
    .progress-bar-wrap {
      max-width: 560px; margin: 16px auto 0;
      background: #1e1e1e; border-radius: 999px; height: 8px; overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #4f8ef7, #a259f7);
      border-radius: 999px; transition: width 0.4s ease;
    }
    .progress-label { text-align: center; font-size: 0.82rem; color: #555; margin-top: 6px; }

    .container { max-width: 680px; margin: 0 auto; }
    .page { display: none; }
    .page.active { display: block; }

    /* Tasks */
    .section { margin-bottom: 36px; }
    .section-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px; user-select: none;
    }
    .section-icon { font-size: 1.2rem; cursor: pointer; }
    .section-title { font-size: 1.05rem; font-weight: 600; color: #ccc; flex: 1; cursor: pointer; }
    .section-count { font-size: 0.8rem; color: #555; background: #1a1a1a; padding: 2px 8px; border-radius: 999px; cursor: pointer; }
    .section-toggle { font-size: 0.75rem; color: #444; transition: transform 0.2s; cursor: pointer; }
    .section-toggle.collapsed { transform: rotate(-90deg); }
    .section-del {
      font-size: 0.7rem; color: #2a2a2a; background: none; border: none;
      cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: color 0.2s; flex-shrink: 0;
    }
    .section-header:hover .section-del { color: #555; }
    .section-del:hover { color: #e05555 !important; }

    .tasks { display: flex; flex-direction: column; gap: 6px; }
    .tasks.hidden { display: none; }

    .task {
      display: flex; align-items: flex-start; gap: 12px;
      background: #141414; border: 1px solid #1f1f1f;
      border-radius: 10px; padding: 12px 14px;
      transition: border-color 0.2s, opacity 0.2s; cursor: pointer;
    }
    .task:hover { border-color: #333; }
    .task.done { opacity: 0.4; }
    .task-check {
      width: 18px; height: 18px; border: 2px solid #333;
      border-radius: 5px; flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .task.done .task-check { background: #4f8ef7; border-color: #4f8ef7; }
    .task.done .task-check::after { content: '✓'; font-size: 11px; color: #fff; font-weight: 700; }
    .task-text { flex: 1; font-size: 0.95rem; line-height: 1.4; }
    .task.done .task-text { text-decoration: line-through; }
    .task-del {
      font-size: 0.7rem; color: #2a2a2a; background: none; border: none;
      cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: color 0.2s; flex-shrink: 0;
    }
    .task:hover .task-del { color: #555; }
    .task-del:hover { color: #e05555 !important; }

    .add-row { display: flex; gap: 8px; margin-top: 10px; }
    .add-input {
      flex: 1; background: #111; border: 1px solid #222;
      border-radius: 8px; padding: 8px 12px; color: #ccc;
      font-size: 0.9rem; outline: none; transition: border-color 0.2s;
    }
    .add-input::placeholder { color: #333; }
    .add-input:focus { border-color: #3a3a3a; }
    .add-btn {
      background: #1a1a2e; border: 1px solid #2a2a4a; color: #4f8ef7;
      border-radius: 8px; padding: 8px 14px; font-size: 0.9rem;
      cursor: pointer; transition: background 0.2s;
    }
    .add-btn:hover { background: #22224a; }

    .new-section-wrap {
      margin-top: 48px; padding-top: 24px;
      border-top: 1px solid #1a1a1a; display: flex; gap: 8px;
    }
    .new-section-input {
      flex: 1; background: #111; border: 1px solid #1f1f1f;
      border-radius: 8px; padding: 10px 14px; color: #ccc; font-size: 0.9rem; outline: none;
    }
    .new-section-input::placeholder { color: #2a2a2a; }
    .new-section-btn {
      background: #111; border: 1px solid #2a2a2a; color: #666;
      border-radius: 8px; padding: 10px 16px; font-size: 0.9rem;
      cursor: pointer; transition: color 0.2s, border-color 0.2s;
    }
    .new-section-btn:hover { color: #aaa; border-color: #444; }

    .emoji-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .emoji-pick {
      background: #1a1a1a; border: 1px solid #222; border-radius: 6px;
      padding: 4px 8px; font-size: 1rem; cursor: pointer; transition: background 0.2s;
    }
    .emoji-pick:hover, .emoji-pick.selected { background: #2a2a2a; border-color: #444; }

    /* Links page */
    .links-add-form {
      background: #141414;
      border: 1px solid #1f1f1f;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .links-add-form input {
      background: #111; border: 1px solid #222; border-radius: 8px;
      padding: 10px 14px; color: #ccc; font-size: 0.9rem; outline: none;
      transition: border-color 0.2s;
    }
    .links-add-form input::placeholder { color: #333; }
    .links-add-form input:focus { border-color: #3a3a3a; }
    .links-add-btn {
      align-self: flex-end;
      background: #1a1a2e; border: 1px solid #2a2a4a; color: #4f8ef7;
      border-radius: 8px; padding: 9px 20px; font-size: 0.9rem;
      cursor: pointer; transition: background 0.2s;
    }
    .links-add-btn:hover { background: #22224a; }

    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #141414;
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      padding: 14px 16px;
      text-decoration: none;
      transition: border-color 0.2s;
      position: relative;
    }
    .link-card:hover { border-color: #333; }

    .link-favicon {
      width: 32px; height: 32px; border-radius: 8px;
      background: #1e1e1e; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; overflow: hidden;
    }
    .link-favicon img { width: 100%; height: 100%; object-fit: contain; border-radius: 6px; }

    .link-info { flex: 1; min-width: 0; }
    .link-desc { font-size: 0.95rem; color: #ddd; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .link-url { font-size: 0.78rem; color: #555; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .link-open {
      font-size: 0.8rem; color: #4f8ef7; text-decoration: none;
      background: #1a1a2e; border: 1px solid #2a2a4a;
      border-radius: 6px; padding: 5px 12px; flex-shrink: 0;
      transition: background 0.2s;
    }
    .link-open:hover { background: #22224a; }

    .link-del {
      font-size: 0.7rem; color: #2a2a2a; background: none; border: none;
      cursor: pointer; padding: 4px 6px; border-radius: 4px;
      transition: color 0.2s; flex-shrink: 0;
    }
    .link-card:hover .link-del { color: #555; }
    .link-del:hover { color: #e05555 !important; }

    .empty-hint { text-align: center; color: #333; font-size: 0.9rem; padding: 40px 0; }
  </style>
</head>
<body>

<header>
  <h1>📁 Папка после армии</h1>
  <p>Всё, что ждёт тебя на гражданке</p>
  <div id="syncStatus"></div>
</header>

<div class="nav">
  <button class="nav-btn active" onclick="showPage('tasks')">📋 Задачи</button>
  <button class="nav-btn" onclick="showPage('links')">🔗 Ссылки</button>
</div>

<!-- Задачи -->
<div class="page active" id="page-tasks">
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <div class="progress-label" id="progressLabel">загрузка...</div>
  <br>
  <div class="container">
    <div id="app"></div>
    <div class="new-section-wrap">
      <div style="flex:1">
        <input class="new-section-input" id="newSectionInput" placeholder="Новая категория..." />
        <div class="emoji-row" id="emojiRow"></div>
      </div>
      <button class="new-section-btn" onclick="addSection()">+ Категория</button>
    </div>
  </div>
</div>

<!-- Ссылки -->
<div class="page" id="page-links">
  <div class="container">
    <div class="links-add-form">
      <input id="linkUrl" placeholder="Ссылка (https://...)" type="url" />
      <input id="linkDesc" placeholder="Описание — что это за сайт" />
      <button class="links-add-btn" onclick="addLink()">Добавить</button>
    </div>
    <div class="links-grid" id="linksGrid"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const db = getFirestore(initializeApp({
  apiKey: "AIzaSyDCMjN0EnRKT6uvMyHuDLs2WVZfahGJ11E",
  authDomain: "trandspot-a85df.firebaseapp.com",
  projectId: "trandspot-a85df",
  storageBucket: "trandspot-a85df.firebasestorage.app",
  messagingSenderId: "824848162009",
  appId: "1:824848162009:web:482603373f3c84520bf2c8"
}));

const TASKS_REF = doc(db, 'army-folder', 'main');
const LINKS_REF = doc(db, 'army-folder', 'links');

const EMOJIS = ['🎯','💪','📚','🎓','💼','🏠','❤️','✈️','🏋️','🎮','🎵','💰','🛠️','🌱','🤝','🚗','📱','🧠','🎨','📝'];
let selectedEmoji = '📌';
let saveTimer = null;
let data = [];
let links = [];

// Emoji picker
const emojiRow = document.getElementById('emojiRow');
EMOJIS.forEach(e => {
  const btn = document.createElement('button');
  btn.className = 'emoji-pick';
  btn.textContent = e;
  btn.onclick = () => {
    document.querySelectorAll('.emoji-pick').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedEmoji = e;
  };
  emojiRow.appendChild(btn);
});

function uid() { return Math.random().toString(36).slice(2); }

function setSyncStatus(state) {
  const el = document.getElementById('syncStatus');
  if (state === 'saved') el.innerHTML = '<span class="sync-badge"><span class="sync-dot"></span>Сохранено</span>';
  else if (state === 'saving') el.innerHTML = '<span class="sync-badge saving"><span class="sync-dot"></span>Сохраняю...</span>';
  else el.innerHTML = '';
}

function scheduleSave(ref, payload) {
  setSyncStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await setDoc(ref, payload);
      setSyncStatus('saved');
      setTimeout(() => setSyncStatus(''), 2000);
    } catch(e) { setSyncStatus(''); }
  }, 800);
}

async function init() {
  try {
    const [snapT, snapL] = await Promise.all([getDoc(TASKS_REF), getDoc(LINKS_REF)]);
    data = snapT.exists() ? snapT.data().data : [];
    links = snapL.exists() ? snapL.data().links : [];
    if (!snapT.exists()) await setDoc(TASKS_REF, { data });
    if (!snapL.exists()) await setDoc(LINKS_REF, { links });
  } catch(e) { data = []; links = []; }
  renderTasks();
  renderLinks();
}

// ── Nav ──
window.showPage = (name) => {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  event.target.classList.add('active');
};

// ── Tasks ──
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateProgress() {
  let total = 0, done = 0;
  data.forEach(s => s.tasks.forEach(t => { total++; if (t.done) done++; }));
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${done} из ${total} выполнено`;
}

function renderTasks() {
  const appEl = document.getElementById('app');
  appEl.innerHTML = '';
  data.forEach((section, si) => {
    const sec = document.createElement('div');
    sec.className = 'section';
    const doneCnt = section.tasks.filter(t => t.done).length;
    sec.innerHTML = `
      <div class="section-header">
        <span class="section-icon" onclick="toggleSection(${si})">${section.icon}</span>
        <span class="section-title" onclick="toggleSection(${si})">${escHtml(section.title)}</span>
        <span class="section-count" onclick="toggleSection(${si})">${doneCnt}/${section.tasks.length}</span>
        <span class="section-toggle ${section.open ? '' : 'collapsed'}" onclick="toggleSection(${si})">▼</span>
        <button class="section-del" onclick="deleteSection(event,${si})">✕</button>
      </div>
      <div class="tasks ${section.open ? '' : 'hidden'}" id="tasks-${si}"></div>
      <div class="${section.open ? '' : 'hidden'}">
        <div class="add-row">
          <input class="add-input" id="inp-${si}" placeholder="Добавить пункт..."
            onkeydown="if(event.key==='Enter') addTask(${si})" />
          <button class="add-btn" onclick="addTask(${si})">+</button>
        </div>
      </div>
    `;
    const tasksEl = sec.querySelector(`#tasks-${si}`);
    section.tasks.forEach((task, ti) => {
      const t = document.createElement('div');
      t.className = `task ${task.done ? 'done' : ''}`;
      t.innerHTML = `
        <div class="task-check"></div>
        <span class="task-text">${escHtml(task.text)}</span>
        <button class="task-del" onclick="deleteTask(event,${si},${ti})">✕</button>
      `;
      t.querySelector('.task-check').addEventListener('click', () => toggleTask(si, ti));
      t.querySelector('.task-text').addEventListener('click', () => toggleTask(si, ti));
      tasksEl.appendChild(t);
    });
    appEl.appendChild(sec);
  });
  updateProgress();
}

window.toggleSection = (si) => { data[si].open = !data[si].open; scheduleSave(TASKS_REF, { data }); renderTasks(); };
window.deleteSection = (e, si) => { e.stopPropagation(); data.splice(si, 1); scheduleSave(TASKS_REF, { data }); renderTasks(); };
window.toggleTask = (si, ti) => { data[si].tasks[ti].done = !data[si].tasks[ti].done; scheduleSave(TASKS_REF, { data }); renderTasks(); };
window.deleteTask = (e, si, ti) => { e.stopPropagation(); data[si].tasks.splice(ti, 1); scheduleSave(TASKS_REF, { data }); renderTasks(); };
window.addTask = (si) => {
  const inp = document.getElementById(`inp-${si}`);
  const text = inp.value.trim();
  if (!text) return;
  data[si].tasks.push({ id: uid(), text, done: false });
  scheduleSave(TASKS_REF, { data }); renderTasks();
  setTimeout(() => { const el = document.getElementById(`inp-${si}`); if (el) el.focus(); }, 50);
};
window.addSection = () => {
  const inp = document.getElementById('newSectionInput');
  const title = inp.value.trim();
  if (!title) return;
  data.push({ id: uid(), icon: selectedEmoji, title, open: true, tasks: [] });
  inp.value = '';
  scheduleSave(TASKS_REF, { data }); renderTasks();
};

// ── Links ──
function getFavicon(url) {
  try {
    const host = new URL(url).hostname;
    return `https://www.google.com/s2/favicons?domain=${host}&sz=64`;
  } catch { return null; }
}

function renderLinks() {
  const grid = document.getElementById('linksGrid');
  grid.innerHTML = '';
  if (!links.length) {
    grid.innerHTML = '<div class="empty-hint">Пока нет ни одной ссылки</div>';
    return;
  }
  links.forEach((link, i) => {
    const card = document.createElement('div');
    card.className = 'link-card';
    const favicon = getFavicon(link.url);
    card.innerHTML = `
      <div class="link-favicon">
        ${favicon ? `<img src="${favicon}" onerror="this.parentElement.textContent='🔗'" />` : '🔗'}
      </div>
      <div class="link-info">
        <div class="link-desc">${escHtml(link.desc || link.url)}</div>
        <div class="link-url">${escHtml(link.url)}</div>
      </div>
      <a class="link-open" href="${escHtml(link.url)}" target="_blank" rel="noopener">Открыть</a>
      <button class="link-del" onclick="deleteLink(${i})">✕</button>
    `;
    grid.appendChild(card);
  });
}

window.addLink = () => {
  let url = document.getElementById('linkUrl').value.trim();
  const desc = document.getElementById('linkDesc').value.trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  links.push({ id: uid(), url, desc });
  document.getElementById('linkUrl').value = '';
  document.getElementById('linkDesc').value = '';
  scheduleSave(LINKS_REF, { links }); renderLinks();
};

window.deleteLink = (i) => {
  links.splice(i, 1);
  scheduleSave(LINKS_REF, { links }); renderLinks();
};

// Enter в полях ссылок
document.getElementById('linkDesc').addEventListener('keydown', e => { if (e.key === 'Enter') addLink(); });

init();
</script>
</body>
</html>
